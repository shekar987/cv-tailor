# Every push and pull request: the unit suites (tests/, node:test — including
# the CV round-trip that reads the contact line back out of a built PDF and
# .docx) and the type check. `next build` is left to Vercel, which runs the
# round-trip again first (package.json prebuild); building here would need the
# Supabase environment.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The Vercel project's version; node:test strips the TypeScript.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
