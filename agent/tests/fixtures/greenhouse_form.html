<!doctype html>
<!--
  Fictional Greenhouse-style job-board application form for the observer tests.
  Company and role are made up. It exercises: label[for], a wrapping label, an
  aria-label, a placeholder-only field, a required select with options, a
  checkbox, a radio group with a legend, a file input, and the submit button.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply: Software Engineer — Acme Robotics</title>
  </head>
  <body>
    <main id="main_fields">
      <h1>Apply for Software Engineer</h1>
      <form id="application_form" action="/apply" method="post">
        <div class="field">
          <label for="first_name">First name <span>*</span></label>
          <input type="text" id="first_name" name="job_application[first_name]" required />
        </div>

        <div class="field">
          <label for="last_name">Last name *</label>
          <input type="text" id="last_name" name="job_application[last_name]" required />
        </div>

        <div class="field">
          <label for="email">Email address *</label>
          <input type="email" id="email" name="job_application[email]" required />
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="job_application[phone]" />
        </div>

        <!-- label wraps the control, no for attribute -->
        <label class="field">
          LinkedIn profile
          <input type="url" name="job_application[linkedin]" data-qa="linkedin-url" />
        </label>

        <!-- aria-label only -->
        <div class="field">
          <input type="text" name="job_application[website]" aria-label="Personal website" placeholder="https://…" />
        </div>

        <!-- placeholder only -->
        <div class="field">
          <input type="text" name="job_application[referral]" placeholder="Who referred you?" />
        </div>

        <div class="field">
          <label for="resume">Resume/CV *</label>
          <input type="file" id="resume" name="job_application[resume]" required />
        </div>

        <div class="field">
          <label for="location">Where are you based? *</label>
          <select id="location" name="job_application[location]" required>
            <option value="">Select…</option>
            <option value="london">London, UK</option>
            <option value="manchester">Manchester, UK</option>
            <option value="remote_uk">Remote (UK)</option>
          </select>
        </div>

        <div class="field">
          <label>
            <input type="checkbox" name="job_application[newsletter]" value="yes" />
            Keep me posted about future roles
          </label>
        </div>

        <fieldset class="field">
          <legend>How did you hear about us? *</legend>
          <label><input type="radio" name="job_application[source]" value="linkedin" required /> LinkedIn</label>
          <label><input type="radio" name="job_application[source]" value="referral" /> A friend</label>
          <label><input type="radio" name="job_application[source]" value="other" /> Other</label>
        </fieldset>

        <input type="hidden" name="job_application[utm]" value="abc" />

        <button type="submit" id="submit_app">Submit application</button>
      </form>
    </main>
  </body>
</html>
