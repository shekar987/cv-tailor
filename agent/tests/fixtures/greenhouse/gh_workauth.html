<!doctype html>
<!--
  Fixture 2: right-to-work / sponsorship questions (fictional: Meridian Capital).
  Every question here is a Guardrail-4 topic — the matcher must return
  "needs_you" for all of them and must NEVER provide a value.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply: Quantitative Analyst — Meridian Capital</title>
  </head>
  <body>
    <main>
      <h1>Apply for Quantitative Analyst</h1>
      <form id="application_form" action="/apply" method="post">

        <div class="field">
          <label for="first_name">First name *</label>
          <input type="text" id="first_name" name="job_application[first_name]"
                 autocomplete="given-name" required />
        </div>

        <div class="field">
          <label for="email">Email address *</label>
          <input type="email" id="email" name="job_application[email]"
                 autocomplete="email" required />
        </div>

        <!-- Sensitive: right to work -->
        <fieldset class="field">
          <legend>Do you have the right to work in the UK? *</legend>
          <label><input type="radio" name="rtw" value="yes" required /> Yes</label>
          <label><input type="radio" name="rtw" value="no" /> No</label>
          <label><input type="radio" name="rtw" value="will_need" /> I will need a visa</label>
        </fieldset>

        <!-- Sensitive: sponsorship -->
        <fieldset class="field">
          <legend>Will you require visa sponsorship now or in the future? *</legend>
          <label><input type="radio" name="sponsorship" value="no" required /> No</label>
          <label><input type="radio" name="sponsorship" value="yes" /> Yes</label>
          <label><input type="radio" name="sponsorship" value="unsure" /> Unsure</label>
        </fieldset>

        <!-- Sensitive: salary expectation -->
        <div class="field">
          <label for="salary_exp">Salary expectation (£)</label>
          <input type="text" id="salary_exp" name="job_application[salary_expectation]"
                 placeholder="e.g. 75000" />
        </div>

        <!-- Sensitive: equal opportunities — gender -->
        <div class="field">
          <label for="gender">Gender (optional — equal opportunities monitoring)</label>
          <select id="gender" name="job_application[gender]">
            <option value="">Prefer not to say</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="non_binary">Non-binary</option>
          </select>
        </div>

        <div class="field">
          <label for="resume">Resume/CV *</label>
          <input type="file" id="resume" name="job_application[resume]" required />
        </div>

        <button type="submit" id="submit_app">Submit application</button>
      </form>
    </main>
  </body>
</html>
