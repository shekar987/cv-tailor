<!doctype html>
<!--
  Fixture 3: extended profile fields including GitHub and cover letter
  (fictional company: Prism Analytics).
  Tests: github synonym, portfolio, cover-letter essay (sensitive: own_words_essay).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply: Data Engineer — Prism Analytics</title>
  </head>
  <body>
    <main>
      <h1>Apply for Data Engineer</h1>
      <form id="application_form" action="/apply" method="post">

        <div class="field">
          <label for="first_name">First name *</label>
          <input type="text" id="first_name" name="job_application[first_name]"
                 autocomplete="given-name" required />
        </div>

        <div class="field">
          <label for="last_name">Last name *</label>
          <input type="text" id="last_name" name="job_application[last_name]"
                 autocomplete="family-name" required />
        </div>

        <div class="field">
          <label for="email">Email address *</label>
          <input type="email" id="email" name="job_application[email]"
                 autocomplete="email" required />
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="job_application[phone]"
                 autocomplete="tel" />
        </div>

        <!-- LinkedIn -->
        <label class="field">
          LinkedIn profile URL
          <input type="url" name="job_application[linkedin]" data-qa="linkedin-url" />
        </label>

        <!-- GitHub — synonym match -->
        <div class="field">
          <label for="github">GitHub profile</label>
          <input type="url" id="github" name="job_application[github]"
                 placeholder="https://github.com/username" />
        </div>

        <!-- Portfolio / personal website -->
        <div class="field">
          <label for="portfolio">Portfolio or personal website</label>
          <input type="url" id="portfolio" name="job_application[portfolio]"
                 placeholder="https://…" />
        </div>

        <div class="field">
          <label for="resume">Resume/CV *</label>
          <input type="file" id="resume" name="job_application[resume]" required />
        </div>

        <!-- Sensitive: own-words essay (cover letter) -->
        <div class="field">
          <label for="cover_letter">Cover letter</label>
          <textarea id="cover_letter" name="job_application[cover_letter]"
                    placeholder="Tell us why you want this role"></textarea>
        </div>

        <button type="submit" id="submit_app">Submit application</button>
      </form>
    </main>
  </body>
</html>
