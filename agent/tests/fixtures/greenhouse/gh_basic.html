<!doctype html>
<!--
  Fixture 1: basic Greenhouse application form (fictional company: Nexaflow Ltd).
  Exercises: autocomplete attrs, label[for], wrapping label, aria-label,
  placeholder, file upload, select, checkbox, radio group, submit button.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply: Backend Engineer — Nexaflow Ltd</title>
  </head>
  <body>
    <main>
      <h1>Apply for Backend Engineer</h1>
      <form id="application_form" action="/apply" method="post">

        <div class="field">
          <label for="first_name">First name *</label>
          <input type="text" id="first_name" name="job_application[first_name]"
                 autocomplete="given-name" required />
        </div>

        <div class="field">
          <label for="last_name">Last name *</label>
          <input type="text" id="last_name" name="job_application[last_name]"
                 autocomplete="family-name" required />
        </div>

        <div class="field">
          <label for="email">Email address *</label>
          <input type="email" id="email" name="job_application[email]"
                 autocomplete="email" required />
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="job_application[phone]"
                 autocomplete="tel" />
        </div>

        <!-- wrapping label — LinkedIn profile -->
        <label class="field">
          LinkedIn profile
          <input type="url" name="job_application[linkedin]" data-qa="linkedin-url" />
        </label>

        <!-- aria-label only — personal website -->
        <div class="field">
          <input type="text" name="job_application[website]"
                 aria-label="Personal website" placeholder="https://…" />
        </div>

        <!-- placeholder only — referral -->
        <div class="field">
          <input type="text" name="job_application[referral]"
                 placeholder="Who referred you?" />
        </div>

        <div class="field">
          <label for="resume">Resume/CV *</label>
          <input type="file" id="resume" name="job_application[resume]" required />
        </div>

        <div class="field">
          <label for="location">Where are you based? *</label>
          <select id="location" name="job_application[location]" required>
            <option value="">Select…</option>
            <option value="london">London, UK</option>
            <option value="remote_uk">Remote (UK)</option>
          </select>
        </div>

        <div class="field">
          <label>
            <input type="checkbox" name="job_application[newsletter]" value="yes" />
            Keep me posted about future roles
          </label>
        </div>

        <fieldset class="field">
          <legend>How did you hear about us? *</legend>
          <label><input type="radio" name="job_application[source]" value="linkedin" required /> LinkedIn</label>
          <label><input type="radio" name="job_application[source]" value="referral" /> A friend</label>
          <label><input type="radio" name="job_application[source]" value="other" /> Other</label>
        </fieldset>

        <input type="hidden" name="authenticity_token" value="abc123" />

        <button type="submit" id="submit_app">Submit application</button>
      </form>
    </main>
  </body>
</html>
